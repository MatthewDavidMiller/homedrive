[package]
name = "hd-client"
description = "The homedrive sync client: the engine, the local state, the watcher, and the homedrive command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
hd-api = { path = "../hd-api" }
hd-chunk = { path = "../hd-chunk" }
hd-common = { path = "../hd-common" }
hd-crypto = { path = "../hd-crypto" }
hd-sys = { path = "../hd-sys", features = ["tls"] }

[dev-dependencies]
hd-store = { path = "../hd-store" }
hd-http = { path = "../hd-http" }
hd-server = { path = "../hd-server" }

[lints]
workspace = true

[[bin]]
name = "homedrive"
path = "src/bin/homedrive.rs"
